[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ldap_shell"
version = "2.1.0"
description = "LDAP shell utility for Active Directory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ldap3",
    "ldapdomaindump",
    "pyasn1",
    "pycryptodomex",
    "dsinternals",
    "minikerberos",
    "winsspi",
    "impacket @ git+https://github.com/blacklanternsecurity/impacket",
    "pyOpenSSL",
    "pycryptodome",
    "textual>=1.0.0",
    "pydantic>=2.0",
    "oscrypto @ git+https://github.com/wbond/oscrypto.git@d5f3437ed24257895ae1edd9e503cfb352e635a8",
    "colorama",
]

[project.scripts]
ldap_shell = "ldap_shell.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ldap_shell"]
